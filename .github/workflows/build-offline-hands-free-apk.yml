name: Build offline hands-free APK

on:
  push:
    branches:
      - feature/offline-hands-free-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build APK
        run: ./gradlew :AnkiDroid:assembleFullDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-hands-free-apk
          path: AnkiDroid/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
